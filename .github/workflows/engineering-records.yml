name: Persistent engineering records
on:
  push:
    branches: [dev/npc-transformation-experimental]
    paths:
      - AGENTS.md
      - docs/engineering/**
      - config/automation-proposal.json
      - Tools/EngineeringGate/**
      - .github/workflows/engineering-records.yml
  pull_request:
    paths:
      - AGENTS.md
      - docs/engineering/**
      - config/automation-proposal.json
      - Tools/EngineeringGate/**
      - .github/workflows/engineering-records.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - run: python -B Tools/EngineeringGate/check_records.py
