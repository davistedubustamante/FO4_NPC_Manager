name: Windows x64 build - FO4 NPC Manager
on:
  push:
    branches:
      - ci/windows-fo4-npc-manager
      - dev/npc-transformation-experimental
    paths:
      - ".github/workflows/windows-build.yml"
      - "FO4_NPC_Manager/**"
      - "FO4_FaceTint_CLI/**"
      - "Tools/AdultTransformationGate/**"
      - "Tools/PluginRoundTripGate/**"
      - "Tools/WoDInspector/**"
      - "Papyrus/**"
      - "Native/**"
      - "Directory.Build.props"
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "FO4_NPC_Manager/**"
      - "FO4_FaceTint_CLI/**"
      - "Tools/AdultTransformationGate/**"
      - "Tools/PluginRoundTripGate/**"
      - "Tools/WoDInspector/**"
      - "Papyrus/**"
      - "Native/**"
      - "Directory.Build.props"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fo4-npc-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-transformation:
    name: Experimental synthetic transformation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.408'
      - name: Exercise the actual transformation engine with synthetic NPCs
        working-directory: Tools/AdultTransformationGate
        run: dotnet run --project AdultTransformationGate.vbproj --configuration Release -- experimental-synthetic-report.json
      - name: Upload synthetic evidence (not a game patch)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EXPERIMENTAL-synthetic-transformation-${{ matrix.os }}
          path: Tools/AdultTransformationGate/experimental-synthetic-report.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: synthetic-transformation
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out FO4 NPC Manager
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: FO4_NPC_Manager
          persist-credentials: false

      - name: Fetch pinned source dependencies in required relative layout
        run: |
          $ErrorActionPreference = 'Stop'
          $repos = @(
            @{ url='https://github.com/MANOLOV02/FO4_Base_Library.git'; dest='FO4_Base_Library'; rev='8dc93e189cccfe026c128eb60d06c94fc949831b' },
            @{ url='https://github.com/MANOLOV02/BSA_BA2_Library_DLL.git'; dest='Ba2_Bsa_Library'; rev='1bfbeb59ca54219e3f208fbee52bc904ef39f743' },
            @{ url='https://github.com/MANOLOV02/NiflySharpFork.git'; dest='NiflySharp'; rev='1e2d9cdfafa9c97c88fc8dd9ca0dc9ecca65a8a8' },
            @{ url='https://github.com/ousnius/Material-Editor.git'; dest='Material-Editor-master'; rev='21411873f17454a2442d6785d533499e14c63adb' },
            @{ url='https://github.com/MANOLOV02/DirectXTexWrapper.git'; dest='../DirectXTextWrapper'; rev='85bf1b688909787d773304f5d40e5577ccddff9e' },
            @{ url='https://github.com/microsoft/DirectXTex.git'; dest='../DirectXTex'; rev='4234f77df9c6c8bb2880607b82d5d597b54d1fa9' }
          )
          foreach ($item in $repos) {
            $dest = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $item.dest))
            git clone --quiet --no-checkout $item.url $dest
            if ($LASTEXITCODE -ne 0) { throw "Failed to clone $($item.url)" }
            git -C $dest checkout --quiet --detach $item.rev
            if ($LASTEXITCODE -ne 0) { throw "Failed to checkout $($item.rev)" }
            if ($item.dest -eq 'NiflySharp') {
              git -C $dest submodule update --init --recursive
              if ($LASTEXITCODE -ne 0) { throw 'NiflySharp submodule update failed' }
            }
            Write-Host "$($item.dest) at $($item.rev)"
          }
          $layout = @(
            'FO4_NPC_Manager/FO4_NPC_Manager/NPC_Manager_FO4.vbproj',
            'FO4_Base_Library/FO4_Base_Library.vbproj',
            'Ba2_Bsa_Library/BSA_BA2_Library_DLL.vbproj',
            'NiflySharp/NiflySharp/NiflySharp.csproj',
            'Material-Editor-master/MaterialLib/MaterialLib.csproj'
          )
          foreach ($path in $layout) {
            if (!(Test-Path (Join-Path $env:GITHUB_WORKSPACE $path))) { throw "Missing $path" }
          }

      - name: Find VS 2026 MSBuild and validate v145
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe not installed' }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (!$vs) { throw 'MSBuild not present in Visual Studio installation' }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          if (!(Test-Path $msbuild)) { throw "MSBuild unavailable: $msbuild" }
          $toolsets = Get-ChildItem (Join-Path $vs 'MSBuild\Microsoft\VC\v180\Platforms\x64\PlatformToolsets') -ErrorAction SilentlyContinue
          if (-not ($toolsets | Where-Object Name -eq 'v145')) { Write-Warning 'v145 not found at anticipated path; actual MSBuild step will determine availability' }
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV
          & $msbuild -version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild version check failed' }

      - name: Compile native DirectXTex library
        run: |
          $p = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'DirectXTex\DirectXTex\DirectXTex_Desktop_2026.vcxproj'
          & $env:MSBUILD $p '-t:Restore;Build' '-p:Configuration=Release;Platform=x64' '-m:2' '-v:minimal' '-bl:directxtex.binlog'
          if ($LASTEXITCODE -ne 0) { throw "DirectXTex build failed: $LASTEXITCODE" }
          $lib = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'DirectXTex\DirectXTex\Bin\Desktop_2026\x64\Release\DirectXTex.lib'
          if (!(Test-Path $lib)) { throw "Expected DirectXTex.lib not found at $lib" }

      - name: Compile FO4 NPC Manager (Publish x64)
        run: |
          & $env:MSBUILD 'FO4_NPC_Manager/FO4_NPC_Manager/NPC_Manager_FO4.vbproj' '-t:Restore;Build' '-p:Configuration=Publish;Platform=x64' '-m:2' '-v:minimal' '-bl:npc-manager.binlog'
          if ($LASTEXITCODE -ne 0) { throw "NPC Manager build failed: $LASTEXITCODE" }

      # FaceTint CLI projects reference native C++/CLI sources that have Release|x64
      # but no Publish|x64 configuration. GUI compilation above still uses Publish.
      - name: Compile FO4 FaceTint CLI (Release x64)
        run: |
          & $env:MSBUILD 'FO4_NPC_Manager/FO4_FaceTint_CLI/FO4_FaceTint_CLI.vbproj' '-t:Restore;Build' '-p:Configuration=Release;Platform=x64' '-m:2' '-v:minimal' '-bl:facetint-cli.binlog'
          if ($LASTEXITCODE -ne 0) { throw "FaceTint CLI build failed: $LASTEXITCODE" }

      - name: Build and exercise isolated NPC ESP round-trip
        run: |
          & $env:MSBUILD 'FO4_NPC_Manager/Tools/PluginRoundTripGate/PluginRoundTripGate.vbproj' '-t:Restore;Build' '-p:Configuration=Release;Platform=x64' '-m:2' '-v:minimal' '-bl:roundtrip.binlog'
          if ($LASTEXITCODE -ne 0) { throw "Round-trip gate build failed: $LASTEXITCODE" }
          $gate = Get-ChildItem 'FO4_NPC_Manager/Tools/PluginRoundTripGate/bin' -Filter 'PluginRoundTripGate.exe' -Recurse | Select-Object -First 1
          if (!$gate) { throw 'Round-trip gate executable missing' }
          & $gate.FullName (Join-Path $env:RUNNER_TEMP 'fo4-roundtrip')
          if ($LASTEXITCODE -ne 0) { throw "Round-trip verification failed: $LASTEXITCODE" }

      - name: Upload experimental binary fixture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EXPERIMENTAL-NPC-ESP-roundtrip-NOT-GAME-VALIDATED
          path: ${{ runner.temp }}/fo4-roundtrip/
          if-no-files-found: error
          retention-days: 7

      - name: Collect compiled outputs
        run: |
          New-Item -ItemType Directory -Force 'build-output' | Out-Null
          $project = 'FO4_NPC_Manager/FO4_NPC_Manager/bin/Publish/net8.0-windows/win-x64'
          if (!(Test-Path $project)) {
            $candidate = Get-ChildItem 'FO4_NPC_Manager/FO4_NPC_Manager/bin' -Filter 'NPC_Manager_FO4.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$candidate) { throw 'Build finished but no GUI executable could be located' }
            $project = $candidate.Directory.FullName
          }
          Copy-Item (Join-Path $project '*') 'build-output' -Recurse -Force
          $cli = Get-ChildItem 'FO4_NPC_Manager/FO4_FaceTint_CLI/bin' -Filter 'FO4_FaceTint_CLI.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$cli) { throw 'FaceTint CLI executable missing' }
          New-Item -ItemType Directory -Force 'build-output/FaceTint-CLI' | Out-Null
          Copy-Item (Join-Path $cli.Directory.FullName '*') 'build-output/FaceTint-CLI' -Recurse -Force

      - name: Verify license bundle and identify experimental provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('LICENSE', 'LICENSE_CREDITS.txt', 'THIRD-PARTY-NOTICES.md', 'licenses/MIT.txt', 'licenses/Apache-2.0.txt', 'licenses/MPL-2.0.txt', 'licenses/GLFW-zlib.txt')
          foreach ($relative in $required) {
            $file = Join-Path 'build-output' $relative
            if (!(Test-Path $file -PathType Leaf)) { throw "License bundle incomplete: $relative" }
            if ((Get-Item $file).Length -eq 0) { throw "Empty license file: $relative" }
          }
          'EXPERIMENTAL / UNTESTED IN GAME. Synthetic transformation tests do not validate FaceGen, dialogue, quests or collection compatibility. Not a release or an installable conversion patch.' | Set-Content 'build-output/EXPERIMENTAL.txt'
          $sources = @('FO4_NPC_Manager', 'FO4_Base_Library', 'Ba2_Bsa_Library', 'NiflySharp', 'Material-Editor-master', '../DirectXTextWrapper', '../DirectXTex')
          $revisions = [ordered]@{}
          foreach ($source in $sources) {
            $revision = git -C $source rev-parse --verify HEAD
            if ($LASTEXITCODE -ne 0) { throw "Cannot record source revision: $source" }
            $revisions[$source] = $revision
          }
          [ordered]@{ status='EXPERIMENTAL-UNTESTED-IN-GAME'; run=$env:GITHUB_RUN_ID; sources=$revisions } | ConvertTo-Json -Depth 4 | Set-Content 'build-output/provenance.json'
          Get-ChildItem 'build-output' -File -Recurse | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path 'build-output'), $_.FullName)
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          } | Set-Content 'build-output/SHA256SUMS.txt'

      - name: Upload successful compilation for isolated testing
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fo4-npc-manager-windows-x64-UNTESTED
          path: build-output/
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostic build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-diagnostics
          path: "*.binlog"
          retention-days: 7
          if-no-files-found: ignore
